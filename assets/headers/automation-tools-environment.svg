  </defs>
  <text x="0" y="20" font-family="'Fira Code', 'JetBrains Mono', Consolas, -apple-system, sans-serif" font-size="17" font-weight="600" fill="url(#h3-shimmer)" letter-spacing="0.2px"><tspan fill="#618F7F" fill-opacity="0.9">❯ </tspan><tspan fill="url(#h3-shimmer)">Automation, Tools &amp; Environment</tspan></text>
